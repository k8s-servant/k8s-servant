{{- /*
The agent's own, namespaced SecretStore: External Secrets reads Key Vault with the
agent's Workload Identity (the same identity that calls Foundry), so the identity only
needs read access to the one Key Vault secret (scripts/setup-workload-identity.sh).
*/ -}}
{{- if .Values.teamsWebhook.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "k8s-servant.name" . }}-keyvault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-servant.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "teamsWebhook.keyVaultUrl is required when teamsWebhook.enabled" .Values.teamsWebhook.keyVaultUrl | quote }}
      serviceAccountRef:
        name: {{ include "k8s-servant.serviceAccountName" . }}
{{- end }}
