{{- /*
Binds the agent's ServiceAccount cluster-wide to:
  view                             built-in: namespaced objects, read-only, never Secrets
  k8s-servant-cluster-reader     clusterrole.yaml: what "view" does not cover
*/ -}}
{{- range list "view" (printf "%s-cluster-reader" (include "k8s-servant.name" .)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-servant.name" $ }}-{{ trimPrefix (printf "%s-" (include "k8s-servant.name" $)) . }}
  labels:
    {{- include "k8s-servant.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-servant.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
