{{- /*
The agent's identity in the cluster and, through Workload Identity, in Azure (Foundry
and Key Vault). The MCP sidecar shares it, so RBAC is defined once (clusterrole*.yaml).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-servant.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-servant.labels" . | nindent 4 }}
    {{- if .Values.azureWorkloadIdentity.enabled }}
    azure.workload.identity/use: "true"
    {{- end }}
  {{- if .Values.azureWorkloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureWorkloadIdentity.clientId is required (printed by scripts/setup-workload-identity.sh)" .Values.azureWorkloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azureWorkloadIdentity.tenantId is required" .Values.azureWorkloadIdentity.tenantId | quote }}
  {{- end }}
