{{- /*
Copies the Teams Workflows webhook URL from Key Vault into the agent's own Secret
(k8s-servant-teams-webhook, key webhook-url). The agent reads it as a file
(TEAMS_WEBHOOK_URL_FILE), never as an environment variable. The Key Vault secret is
shared with Alertmanager; the Kubernetes Secret is not.
*/ -}}
{{- if .Values.teamsWebhook.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "k8s-servant.name" . }}-teams-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-servant.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.teamsWebhook.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "k8s-servant.name" . }}-keyvault
  target:
    name: {{ include "k8s-servant.name" . }}-teams-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: {{ .Values.teamsWebhook.keyVaultSecretName }}
{{- end }}
