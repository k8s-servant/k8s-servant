# Example values for one AKS cluster: the complete Azure setup.
#   - Azure AI Foundry as the model, reached with Workload Identity (no API key);
#   - the Teams webhook URL kept in Azure Key Vault and synced into a Kubernetes Secret
#     by External Secrets Operator (ESO), which also authenticates with Workload Identity.
# The chart itself knows nothing about Key Vault or ESO: the SecretStore and
# ExternalSecret below are ordinary manifests installed through extraObjects, and the
# chart only mounts the resulting Secret. Prerequisites: ESO installed in the cluster,
# and scripts/setup-workload-identity.sh run (identity, federated credential, roles).
# Only what differs from the chart defaults is here; every key is explained in
# charts/k8s-servant/values.yaml. All names below are placeholders.
#
#   helm install k8s-servant oci://ghcr.io/k8s-servant/charts/k8s-servant \
#     -n k8s-servant --create-namespace \
#     -f examples/knowledge-values.yaml -f examples/values-azure.yaml
#
# The CLI learns the same with:
#   k8s-servant --values examples/knowledge-values.yaml --values examples/values-azure.yaml ask "..."

# Extra labels on every object.
labels:
  # Free-form; use whatever your conventions need.
  environment: production

# Managed identity for Foundry and Key Vault, created by scripts/setup-workload-identity.sh.
azureWorkloadIdentity:
  # Off by default in the chart; this example uses it.
  enabled: true
  # Client ID printed by the script.
  clientId: "00000000-0000-0000-0000-000000000000"
  # Your Entra ID tenant.
  tenantId: "00000000-0000-0000-0000-000000000000"

# Agent settings for this cluster.
appConfig:
  # Shown in reports and Teams cards.
  CLUSTER_NAME: my-cluster
  # Foundry resource created by scripts/setup-foundry.sh.
  LLM_PROVIDER: foundry
  LLM_ENDPOINT: https://my-foundry.openai.azure.com/openai/v1/
  # The Foundry deployment name.
  LLM_MODEL: my-deployment
  # Entra ID tokens through Workload Identity; no key.
  LLM_AUTH: entra
  # kube-prometheus-stack in this cluster.
  PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc:9090
  # Alertmanager of kube-prometheus-stack.
  ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc:9093
  # Local time zone of the morning report.
  MORNING_REPORT_TIMEZONE: Europe/Berlin

# Teams: post health-check changes and the morning report. The chart mounts this
# Secret; the ExternalSecret below creates it from Key Vault.
teamsWebhook:
  # Created by the ExternalSecret in extraObjects.
  existingSecret: k8s-servant-teams-webhook
  # Key inside that Secret.
  secretKey: webhook-url

# ESO objects, installed with the release. The SecretStore reads Key Vault as the
# agent's own ServiceAccount (Workload Identity), so the identity needs only
# "Key Vault Secrets User" on the one secret.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata:
      name: k8s-servant-keyvault
    spec:
      provider:
        azurekv:
          authType: WorkloadIdentity
          vaultUrl: https://my-keyvault.vault.azure.net
          serviceAccountRef:
            name: k8s-servant
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: k8s-servant-teams-webhook
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: SecretStore
        name: k8s-servant-keyvault
      target:
        name: k8s-servant-teams-webhook
        creationPolicy: Owner
      data:
        - secretKey: webhook-url
          remoteRef:
            key: teams-webhook-url

# What the agent should know about this cluster (added to the platform description).
knowledge:
  clusterNotes: |
    - This is my-cluster: production, 8-10 nodes.
    - kured reboots nodes on Sundays 02:00-05:00 UTC, one node at a time.
    - Treat anything that can affect users (missing replicas, ingress, DNS) as critical.
