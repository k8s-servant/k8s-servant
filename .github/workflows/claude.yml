name: Claude

# Runs Claude Code when a maintainer mentions @claude in an issue, a PR comment or a
# review. Only trusted authors (owner, org members, collaborators) can trigger it,
# because the job holds write permissions and the Claude credential.
#
# Claude may run the tests, ruff and helm lint so it checks its work before pushing,
# except on fork PRs: running untrusted code next to the credential would leak it.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] gated on trusted author_association below
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Tests are allowed for issues and for PRs from a branch in this repository only.
      - name: Decide whether Claude may run the test suite
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          is_pr=false
          head="${PR_HEAD_REPO}"
          if [ -n "${PR_HEAD_REPO}" ] || [ "${EVENT#pull_request}" != "${EVENT}" ]; then
            is_pr=true
          fi
          if [ "${EVENT}" = issue_comment ] && [ -n "${ISSUE_PR_URL}" ]; then
            is_pr=true
            head=$(gh api "${ISSUE_PR_URL}" --jq '.head.repo.full_name // ""')
          fi
          # A PR whose head repo is unknown (deleted fork) counts as untrusted.
          if [ "${is_pr}" = false ] || [ "${head}" = "${REPO}" ]; then
            echo "run_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_tests=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.trust.outputs.run_tests == 'true'
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.trust.outputs.run_tests == 'true'
      - name: Install dev dependencies
        if: steps.trust.outputs.run_tests == 'true'
        run: python -m venv .venv && .venv/bin/pip install --quiet -e '.[dev]'
      - uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The same commands as CLAUDE.md lists; nothing else gains shell access.
          claude_args: >-
            ${{ steps.trust.outputs.run_tests == 'true'
            && '--allowedTools "Bash(.venv/bin/pytest:*),Bash(.venv/bin/ruff:*),Bash(helm lint:*),Bash(helm template:*)"'
            || '' }}
