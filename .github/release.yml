changelog:
  exclude:
    labels: ["autorelease: pending", "autorelease: tagged"]
  categories:
    - title: Breaking changes
      labels: ["breaking-change"]
    - title: Features
      labels: ["type/feature"]
    - title: Bug fixes
      labels: ["type/bug"]
    - title: Security
      labels: ["type/security"]
    - title: Documentation
      labels: ["type/docs"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
