# Documentation site, published to https://k8s-servant.dev by .github/workflows/docs.yml.
# Build locally: pip install -e '.[docs]' && zensical serve
[project]
site_name = "k8s-servant"
site_url = "https://k8s-servant.dev/"
site_description = "A read-only AI SRE for Kubernetes: finds what is wrong, explains why with evidence, and never changes the cluster."
copyright = "Copyright &copy; k8s-servant maintainers. Apache-2.0."
repo_url = "https://github.com/k8s-servant/k8s-servant"
repo_name = "k8s-servant/k8s-servant"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
# Design documents stay in the repository but out of the site.
exclude_docs = """
/superpowers/
"""
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Quickstart" = "getting-started.md" },
    { "Deploy to a cluster" = "deployment.md" },
    { "Run from a mirror" = "running-from-a-mirror.md" },
  ] },
  { "Model providers" = [
    { "Overview" = "model-providers.md" },
    { "Anthropic" = "providers/anthropic.md" },
    { "OpenAI" = "providers/openai.md" },
    { "Ollama" = "providers/ollama.md" },
    { "OpenAI-compatible" = "providers/openai-compatible.md" },
    { "Azure AI Foundry" = [
      { "GPT and other models" = "providers/foundry.md" },
      { "Claude on Foundry" = "providers/foundry-claude.md" },
      { "Concepts" = "foundry-concepts.md" },
      { "Setup guide" = "foundry-setup.md" },
    ] },
  ] },
  { "Configure" = [
    { "Settings" = "configuration.md" },
    { "MS Teams" = "teams-setup.md" },
    { "Teaching the agent" = "knowledge-and-skills.md" },
  ] },
  { "Use" = [
    { "The command" = "cli.md" },
    { "Reports" = "reports.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "FAQ and limitations" = "faq.md" },
  ] },
  { "How it works" = [
    { "Overview" = "how-it-works.md" },
    { "Architecture" = "architecture.md" },
    { "Tools" = "tools.md" },
    { "Memory" = "memory.md" },
    { "How the agent learns" = "how-the-agent-learns.md" },
    { "Data processing" = "data-processing.md" },
    { "Technology" = "technology.md" },
  ] },
  { "Security" = [
    { "Security model" = "security.md" },
    { "Verifying releases" = "verifying-releases.md" },
  ] },
  { "Contribute" = [
    { "Code walkthrough" = "code-walkthrough.md" },
    { "Development guide" = "development.md" },
    { "CI and releases" = "ci-and-releases.md" },
  ] },
  { "Roadmap" = "roadmap.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
logo = "images/icon.svg"
favicon = "images/icon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/k8s-servant/k8s-servant"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
# GitHub-style "> [!WARNING]" alerts render as admonitions, so pages read the same on GitHub.
pymdownx.quotes.callouts = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
